<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Balloon Pop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 44px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            color: #fff;
        }

        .logo {
            text-align: center;
            font-size: 52px;
            margin-bottom: 6px;
        }

        h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 28px;
        }

        .flash {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid rgba(255, 80, 80, 0.5);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #ffaaaa;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: rgba(100, 200, 255, 0.6);
            background: rgba(255,255,255,0.12);
        }

        input::placeholder { color: rgba(255,255,255,0.3); }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0f3460, #1a6ebf);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        button[type="submit"]:hover  { opacity: 0.9; }
        button[type="submit"]:active { transform: scale(0.98); }

        .switch {
            text-align: center;
            margin-top: 22px;
            font-size: 13.5px;
            color: rgba(255,255,255,0.5);
        }

        .switch a {
            color: #64c8ff;
            text-decoration: none;
            font-weight: 600;
        }

        .switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🎈</div>
        <h2>Welcome Back!</h2>
        <p class="subtitle">Log in to continue your game</p>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash">⚠ {{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form action="/login" method="POST">
            <label>Username</label>
            <input type="text" name="name" placeholder="Enter your username" required autocomplete="username">

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">

            <button type="submit">Log In &amp; Play 🎮</button>
        </form>

        <div class="switch">
            New here? <a href="/register">Create an account</a>
        </div>
    </div>
</body>
</html>
